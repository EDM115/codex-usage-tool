name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci:
    name: "Checks types & tests"
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Bump Node to v26"
        uses: actions/setup-node@v7
        with:
          check-latest: true
          node-version: 26

      - name: "Install Bun"
        uses: oven-sh/setup-bun@v2

      - name: "Install dependencies"
        run: bun i --frozen-lockfile

      - name: "Types check"
        run: bun typecheck

      - name: "Run the tests"
        run: bun test
